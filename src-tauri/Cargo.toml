[package]
name = "testoc"
version = "0.1.0"
description = "High-resolution hardware stability testing and telemetry suite"
authors = ["xDead"]
edition = "2021"

[lib]
name = "testoc_lib"
crate-type = ["rlib"]

[[bin]]
name = "testoc"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-utils = "0.8.23"
csv = "1.4.0"
getrandom = "0.4.3"
log = "0.4.35"
nvml-wrapper = "0.13.0"
parking_lot = "0.13.0"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
thiserror = "2.0.21"
ts-rs = "12.0.1"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "vulkan", "wgsl", "parking_lot"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Registry"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
